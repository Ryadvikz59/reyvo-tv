name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Extract project
        run: |
          mkdir projet && cd projet
          base64 -d <<'FIN' | tar xJ
          
          FIN
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: projet
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../reyvo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-build
          name: Derniere build
          prerelease: true
          files: reyvo.apk
