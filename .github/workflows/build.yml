      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: projet
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../reyvo.apk
      - name: Erreurs
        if: failure()
        run: |
          { echo '## Erreurs'; echo '```'; grep -E '^e: |What went wrong|error:' -A3 build.log | head -80; echo '```'; } >> $GITHUB_STEP_SUMMARY
          grep -E '^e: |What went wrong' -A3 build.log | head -80
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-build
          name: Derniere build
          prerelease: true
          files: reyvo.apk
