      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: projet
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../reyvo.apk
          # version.txt: read by the app to offer the update (line 1 = versionCode, line 2 = versionName)
          { grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+'; grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2; } > ../version.txt
          cat ../version.txt
      - name: Erreurs
        if: failure()
        run: |
          { echo '## Erreurs'; echo '```'; grep -E '^e: |What went wrong|error:' -A3 build.log | head -80; echo '```'; } >> $GITHUB_STEP_SUMMARY
          grep -E '^e: |What went wrong' -A3 build.log | head -80
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-build
          name: Derniere build
          prerelease: true
          files: |
            reyvo.apk
            version.txt
      - name: Apercu navigateur (Appetize)
        if: env.APPETIZE_TOKEN != '' && env.APPETIZE_KEY != ''
        continue-on-error: true
        run: |
          curl -sS -f -X POST "https://api.appetize.io/v1/apps/$APPETIZE_KEY" \
            -H "X-API-KEY: $APPETIZE_TOKEN" -H "Content-Type: application/json" \
            -d '{"url":"https://github.com/Ryadvikz59/reyvo-tv/releases/download/derniere-build/reyvo.apk","platform":"android","fileType":"apk"}'
          echo "Apercu : https://appetize.io/app/$APPETIZE_KEY" >> $GITHUB_STEP_SUMMARY
